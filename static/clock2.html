<!DOCTYPE html>
<html>

<head>
  <title>Clock</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    .geist-mono {
      font-family: "Geist Mono", monospace;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background-color: rgb(15, 23, 42);
      color: white;
      display: flex;
      height: 100dvh;
      padding: 2dvh 3vw;
    }

    .error {
      color: red;
    }

    .battery {
      color: orange;
    }

    .clock {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .text-small {
      font-size: min(6vw, 6dvh);
    }

    .text-large {
      font-size: min(30vw, 45dvh);
      line-height: 1;
    }

    #date {
      text-align: center;
    }

    #time {
      text-align: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 1rem;
    }

    .row .center {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: min(6vw, 6dvh);
    }
  </style>
</head>

<body class="geist-mono">
  <div class="clock">
    <div id="date" class="text-small">&nbsp;</div>
    <div id="time" class="text-large">--:--</div>
    <div class="row">
      <div id="temp" class="text-small">-&deg;</div>
      <div class="center">
        <div id="sunrise" class="text-small">&uarr;--:--</div>
        <div id="sunset" class="text-small">&darr;--:--</div>
      </div>
      <div id="humidity" class="text-small">-%</div>
    </div>
  </div>
  <script>
    async function loadInto(id, url) {
      const el = document.getElementById(id);
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        el.innerHTML = await res.text();
        el.classList.remove("error");
      } catch (error) {
        el.classList.add("error");
        console.error("Error loading " + url + ": " + error.toString());
      }
    }

    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
      "August", "September", "October", "November", "December"];

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function renderDateTime() {
      const now = new Date();
      document.getElementById("date").textContent =
        `${DAYS[now.getDay()]} ${MONTHS[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;
      document.getElementById("time").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function loadWeather() {
      loadInto("temp", "/snippets/temperature");
      loadInto("humidity", "/snippets/humidity");
    }

    function loadSunriseSunset() {
      loadInto("sunrise", "/snippets/sunrise");
      loadInto("sunset", "/snippets/sunset");
    }

    renderDateTime();
    loadWeather();
    loadSunriseSunset();
    setInterval(renderDateTime, 1000);
    setInterval(loadWeather, 300000);
    setInterval(loadSunriseSunset, 300000);
  </script>
</body>

</html>
