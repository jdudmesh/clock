<!DOCTYPE html>
<html>

<head>
  <title>Clock</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    .geist-mono {
      font-family: "Geist Mono", monospace;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background-color: rgb(15, 23, 42);
      color: white;
      display: flex;
      height: 100dvh;
      padding: 2dvh 3vw;
      transition: opacity 1s ease;
    }

    .error {
      color: red;
    }

    .battery {
      color: orange;
    }

    .clock {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .text-small {
      font-size: min(10vw, 10dvh);
    }

    .text-large {
      font-size: min(30vw, 45dvh);
      line-height: 1;
    }

    .text-large.counting {
      font-size: min(18vw, 27dvh);
    }

    .text-tiny {
      font-size: min(14vw, 21dvh);
      opacity: 0.7;
      text-align: center;
      line-height: 1;
    }

    #date {
      text-align: center;
    }

    #time {
      text-align: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 1rem;
    }

    .row .center {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: min(6vw, 6dvh);
    }

    .time-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .time-row .icon-btn {
      position: absolute;
      right: 0;
    }

    .icon-btn {
      font-size: min(7vw, 7dvh);
      line-height: 1;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      padding: 0.3em;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .icon-btn.running {
      background: rgba(255, 255, 255, 0.2);
    }

    .icon-btn.alarm {
      background: rgba(220, 38, 38, 0.8);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .clock.shaking {
      animation: shake 0.5s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: translateX(-1.5vw);
      }
      20%, 40%, 60%, 80% {
        transform: translateX(1.5vw);
      }
    }
  </style>
</head>

<body class="geist-mono">
  <div class="clock">
    <div id="date" class="text-small">&nbsp;</div>
    <div id="realtime" class="text-tiny" style="display: none;">--:--</div>
    <div class="time-row">
      <div id="time" class="text-large">--:--</div>
      <button id="timerBtn" class="icon-btn" aria-label="Start 20 minute timer">&#9202;</button>
    </div>
    <div class="row">
      <div id="temp" class="text-small">-&deg;</div>
      <div class="center">
        <div id="sunrise" class="text-small">&uarr;--:--</div>
        <div id="sunset" class="text-small">&darr;--:--</div>
      </div>
      <div id="humidity" class="text-small">-%</div>
    </div>
  </div>
  <script>
    async function loadInto(id, url) {
      const el = document.getElementById(id);
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        el.innerHTML = await res.text();
        el.classList.remove("error");
      } catch (error) {
        el.classList.add("error");
        console.error("Error loading " + url + ": " + error.toString());
      }
    }

    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
      "August", "September", "October", "November", "December"];

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function currentTimeStr(now) {
      return `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.round(ms / 1000));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${pad(m)}:${pad(s)}`;
    }

    const TIMER_DURATION_MS = 20 * 60 * 1000;
    let timerState = "idle"; // idle | running | alarm
    let timerEndAt = null;
    let alarmIntervalId = null;
    let shakeTimeoutId = null;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function beep() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }

    function startAlarm() {
      timerState = "alarm";
      updateTimerButton();
      document.querySelector(".clock").classList.add("shaking");
      shakeTimeoutId = setTimeout(() => {
        document.querySelector(".clock").classList.remove("shaking");
      }, 2000);
      beep();
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      alarmIntervalId = setInterval(() => {
        beep();
        if (navigator.vibrate) navigator.vibrate(400);
      }, 1500);
    }

    function stopAlarm() {
      if (shakeTimeoutId) {
        clearTimeout(shakeTimeoutId);
        shakeTimeoutId = null;
      }
      document.querySelector(".clock").classList.remove("shaking");
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
    }

    function updateTimerButton() {
      const btn = document.getElementById("timerBtn");
      btn.classList.toggle("running", timerState === "running");
      btn.classList.toggle("alarm", timerState === "alarm");
      btn.innerHTML = timerState === "idle" ? "&#9202;" : "&#9209;";
      btn.setAttribute(
        "aria-label",
        timerState === "idle" ? "Start 20 minute timer" : "Cancel timer"
      );
    }

    function toggleTimer() {
      if (timerState === "idle") {
        getAudioCtx().resume();
        timerEndAt = Date.now() + TIMER_DURATION_MS;
        timerState = "running";
      } else {
        stopAlarm();
        timerState = "idle";
        timerEndAt = null;
      }
      updateTimerButton();
      tick();
    }

    function tick() {
      const now = new Date();
      document.getElementById("date").textContent =
        `${DAYS[now.getDay()]} ${MONTHS[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;

      const realtimeEl = document.getElementById("realtime");
      const timeEl = document.getElementById("time");

      if (timerState === "idle") {
        realtimeEl.style.display = "none";
        timeEl.classList.remove("counting");
        timeEl.textContent = currentTimeStr(now);
        return;
      }

      realtimeEl.style.display = "block";
      realtimeEl.textContent = currentTimeStr(now);
      timeEl.classList.add("counting");

      if (timerState === "running") {
        const remaining = timerEndAt - now.getTime();
        if (remaining <= 0) {
          timeEl.textContent = "00:00";
          startAlarm();
        } else {
          timeEl.textContent = formatCountdown(remaining);
        }
      } else if (timerState === "alarm") {
        timeEl.textContent = "00:00";
      }
    }

    function loadWeather() {
      loadInto("temp", "/snippets/temperature");
      loadInto("humidity", "/snippets/humidity");
    }

    function loadSunriseSunset() {
      loadInto("sunrise", "/snippets/sunrise");
      loadInto("sunset", "/snippets/sunset");
    }

    let sunriseTime = null;
    let sunsetTime = null;

    async function loadDaylight() {
      try {
        const res = await fetch("/data.json");
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        sunriseTime = new Date(data.sunrise);
        sunsetTime = new Date(data.sunset);
        applyDimming();
      } catch (error) {
        console.error("Error loading daylight data: " + error.toString());
      }
    }

    function applyDimming() {
      if (!sunriseTime || !sunsetTime) return;
      const now = new Date();
      const isNight = now < sunriseTime || now > sunsetTime;
      document.body.style.opacity = isNight ? "0.75" : "1";
    }

    document.getElementById("timerBtn").addEventListener("click", toggleTimer);

    tick();
    loadWeather();
    loadSunriseSunset();
    loadDaylight();
    setInterval(tick, 1000);
    setInterval(applyDimming, 1000);
    setInterval(loadWeather, 300000);
    setInterval(loadSunriseSunset, 300000);
    setInterval(loadDaylight, 24 * 60 * 60 * 1000);
  </script>
</body>

</html>
